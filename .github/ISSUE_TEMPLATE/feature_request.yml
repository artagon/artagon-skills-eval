name: Feature request
description: Propose a capability, adapter, verifier, or OpenSpec change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What capability or workflow gap does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed design
      description: Affected packages (`artagon-eval-core`, `artagon-eval-skills`, adapters), invariants, and acceptance criteria.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Repository invariants checked
      options:
        - label: Preserves subscription-first / zero-metered-billing guarantees
        - label: Preserves holdout split quarantine and SecretVault redaction
        - label: Compatible with MIT / Apache-2.0 permissive SPDX policy
