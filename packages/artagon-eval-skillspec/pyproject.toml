[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "artagon-eval-skillspec"
version = "0.2.0"
description = "Decoupled SkillSpec Rust CLI benchmark and Phase-1 search adapter for artagon-skills-eval."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Artagon" }]
dependencies = [
  "artagon-eval-core>=0.2.0,<0.3",
]

[project.entry-points."artagon_eval.benchmarks"]
skillspec = "artagon_eval_skillspec.plugin:create_benchmark_adapter"

[project.entry-points."artagon_eval.optimizers"]
skillspec = "artagon_eval_skillspec.plugin:create_optimizer_adapter"

[tool.hatch.build.targets.wheel]
packages = ["src/artagon_eval_skillspec"]
