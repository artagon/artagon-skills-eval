harness: kimi
binary_name: kimi
campaign_v1_supported: false
skillopt_supported: true

auth:
  vendor_family: moonshot
  default_model: kimi-k2-thinking
  harness_home_env: KIMI_CODE_HOME
  subscription_files:
    - config.toml
    - credentials.json
  subscription_env_vars: []
  api_key_env_var: MOONSHOT_API_KEY
  provider_base_url_env: MOONSHOT_BASE_URL
  scrubbed_env_vars:
    - MOONSHOT_API_KEY
    - MOONSHOT_BASE_URL
    - KIMI_API_KEY
  metered_env_prefixes: []

system_prompt:
  default:
    flags: []
  append:
    flags: []
    write_rel_path: AGENTS.md
    target_root: workspace
  replace:
    flags: []
    write_rel_path: AGENTS.md
    target_root: workspace

hooks:
  home_env_var: KIMI_CODE_HOME
  default_home_rel: .kimi-code
  user_hook_rel: config.toml
  workspace_hook_rel: null
  format: toml
  dialect: event_array
  events:
    - SessionStart
    - UserPromptSubmit
    - PreToolUse
    - PostToolUse
    - PermissionRequest
    - PermissionResult
    - Stop
    - SessionEnd
    - SubagentStart
    - SubagentStop
    - Notification
  timeout_field: timeout
  timeout_seconds: 5

otel:
  delivery: none
  protocol: none

transcript:
  session_rel_dir: sessions
  format: jsonl
  jmespath_queries:
    model: "model || message.model"
    tool_name: "tool_name || name"
    tool_calls: "tool_calls[].{tool_use_id: id, tool_name: function.name || name, arguments: function.arguments || arguments}"
    assistant_text_blocks: "message.content[?type=='text'].text[] || content[?type=='text'].text[]"
    final_response: "result || message.content || content"
    usage: "usage"

reflect_no_tools:
  supported: true
  base_flags:
    - --print
    - --output-format
    - stream-json
  required_probe_flags:
    - --print
    - --output-format
  read_only_requires_sandbox: false

headless:
  subcommand: []
  prompt_flag: "-p"
  prompt_position: flag
  cwd_flag: "-w"
  base_flags:
    - --print
    - --output-format
    - stream-json
    - --yolo
  tier2_common_flags: []
  model_flag: --model
  effort_flag: null
  mcp_config_flag:
    - --mcp-config-file
    - "{path}"
  required_probe_flags:
    - --print
    - --output-format
    - --yolo

version_overlays:
  - specifier: ">=2.0.0"
    overrides:
      reflect_no_tools:
        base_flags:
          - --output-format
          - stream-json
        required_probe_flags:
          - --prompt
          - --output-format
      headless:
        cwd_flag: null
        add_dir_flag: --add-dir
        base_flags:
          - --output-format
          - stream-json
          - --yolo
        mcp_config_flag: []
        required_probe_flags:
          - --prompt
          - --output-format
          - --yolo
          - --model
