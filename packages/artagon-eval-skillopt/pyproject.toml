[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "artagon-eval-skillopt"
version = "0.2.0"
description = "Decoupled SkillOpt 0.2.0 isolated subscription optimizer adapter for artagon-skills-eval."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Artagon" }]
dependencies = [
  "artagon-eval-core>=0.2.0,<0.3",
]

[project.entry-points."artagon_eval.optimizers"]
skillopt = "artagon_eval_skillopt.plugin:create_optimizer_adapter"

[tool.hatch.build.targets.wheel]
packages = ["src/artagon_eval_skillopt"]
