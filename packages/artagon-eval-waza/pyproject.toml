[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "artagon-eval-waza"
version = "0.2.0"
description = "Decoupled Waza benchmark and outcome-sink adapter for artagon-skills-eval."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Artagon" }]
dependencies = [
  "artagon-eval-core>=0.2.0,<0.3",
]

[project.entry-points."artagon_eval.benchmarks"]
waza = "artagon_eval_waza.plugin:create_benchmark_adapter"

[project.entry-points."artagon_eval.sinks"]
waza-outcome = "artagon_eval_waza.plugin:create_sink_adapter"

[tool.hatch.build.targets.wheel]
packages = ["src/artagon_eval_waza"]
