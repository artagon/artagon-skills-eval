repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format-check
        name: ruff format --check
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy --strict
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: basedpyright
        name: basedpyright --strict
        entry: uv run --frozen basedpyright
        language: system
        types: [python]
        pass_filenames: false

      - id: radon-complexity
        name: radon cc -n C
        entry: uv run --frozen radon cc -n C packages/*/src
        language: system
        types: [python]
        pass_filenames: false

      - id: import-linter
        name: lint-imports
        entry: uv run --frozen lint-imports
        language: system
        types: [python]
        pass_filenames: false

      - id: ast-grep-test
        name: ast-grep rule tests
        entry: ast-grep test --config sgconfig.yml
        language: system
        files: ^(sgconfig\.yml|rules/|rule-tests/)
        pass_filenames: false

      - id: ast-grep-scan
        name: ast-grep structural scan
        entry: ast-grep scan --config sgconfig.yml
        language: system
        types: [python]
        pass_filenames: false

      - id: skill-lint
        name: skills-ref Tier-0 lint
        entry: uv run --frozen skill-lint --skills-dir skills
        language: system
        files: ^skills/
        pass_filenames: false
